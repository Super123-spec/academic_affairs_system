<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选课名单查询 - 教务管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="urp-body">
        <div class="urp-main">
            <div class="urp-panel">
                <div class="urp-panel-title">选课名单查询</div>
                <div class="search-bar">
                    <select id="offeringSel" style="min-width:260px;"></select>
                    <button class="btn btn-primary" data-action="loadStudents">查询名单</button>
                </div>
                <table class="table">
                    <thead><tr><th>学号</th><th>姓名</th><th>性别</th><th>班级</th></tr></thead>
                    <tbody id="stuBody"><tr><td colspan="4" class="text-center" style="color:#999">请选择课程查询</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/js/student.js"></script>
    <script src="/js/pages/student/offering-students.js"></script>
</body>
</html>
