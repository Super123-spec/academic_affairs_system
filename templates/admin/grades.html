<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩管理 - 教务管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="content" id="pageContent">
        <h2 class="page-title">成绩管理</h2>
        <div class="search-bar">
            <input type="text" id="keyword" placeholder="学号 / 姓名 / 课程名称">
            <button class="btn btn-primary" data-action="loadList">查询</button>
        </div>
        <div class="card"><div class="card-body">
            <table class="table">
                <thead><tr><th>学号</th><th>姓名</th><th>课程</th><th>学期</th><th>平时</th><th>考试</th><th>总评</th><th>绩点</th><th>操作</th></tr></thead>
                <tbody id="listBody"><tr><td colspan="9"><div class="loading"></div></td></tr></tbody>
            </table>
        </div></div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">修改成绩<span class="modal-close" data-action="closeModal" data-arg='["editModal"]'>✕</span></div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <p id="editInfo" style="margin-bottom:14px;color:#555;"></p>
                <div class="form-row">
                    <div class="form-group"><label>平时成绩</label><input type="number" id="f_usual" min="0" max="100" step="0.5"></div>
                    <div class="form-group"><label>考试成绩</label><input type="number" id="f_exam" min="0" max="100" step="0.5"></div>
                </div>
                <p id="ratioInfo" style="color:#888;font-size:13px;">总评成绩按课程设置的平时/考试比例自动计算。</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" data-action="closeModal" data-arg='["editModal"]'>取消</button>
                <button class="btn btn-primary" data-action="saveGrade">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
    <script src="/js/pages/admin/grades.js"></script>
</body>
</html>
