<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学籍异动申请 - 教务管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="urp-body">
        <div class="urp-main">
            <div class="urp-panel">
                <div class="urp-panel-title">学籍异动申请</div>
                <form id="applyForm" style="max-width:560px;">
                    <div class="form-group"><label>异动类型</label>
                        <select id="changeType"><option>休学</option><option>复学</option><option>转专业</option><option>退学</option></select>
                    </div>
                    <div class="form-group"><label>申请理由</label>
                        <textarea id="reason" rows="4" placeholder="请填写申请理由" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">提交申请</button>
                </form>
            </div>
            <div class="urp-panel">
                <div class="urp-panel-title">我的申请记录</div>
                <table class="table">
                    <thead><tr><th>类型</th><th>申请理由</th><th>申请日期</th><th>状态</th><th>审核意见</th></tr></thead>
                    <tbody id="recordBody"><tr><td colspan="5"><div class="loading"></div></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/js/student.js"></script>
    <script src="/js/pages/student/apply-status-change.js"></script>
</body>
</html>
