<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校外课程学分节点替代申请 - 教务管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="urp-body">
        <div class="urp-main">
            <div class="urp-panel">
                <div class="urp-panel-title">校外课程学分节点替代申请</div>
                <form id="applyForm" style="max-width:560px;">
                    <div class="form-group"><label>校外学校 / 机构 *</label><input type="text" id="extSchool" required placeholder="如：清华大学（学堂在线）"></div>
                    <div class="form-row">
                        <div class="form-group"><label>校外课程名称 *</label><input type="text" id="extCourse" required></div>
                        <div class="form-group"><label>校外学分</label><input type="number" id="extCredit" step="0.5" min="0" placeholder="如 2.0"></div>
                    </div>
                    <div class="form-group"><label>替代的本校课程</label><select id="courseSel"><option value="">请选择</option></select></div>
                    <div class="form-group"><label>申请说明</label><textarea id="reason" rows="3" placeholder="请说明修读情况及替代理由"></textarea></div>
                    <button type="submit" class="btn btn-primary">提交申请</button>
                </form>
            </div>
            <div class="urp-panel">
                <div class="urp-panel-title">我的申请记录</div>
                <table class="table">
                    <thead><tr><th>校外课程</th><th>替代课程</th><th>学分</th><th>状态</th><th>审核意见</th><th>申请时间</th></tr></thead>
                    <tbody id="recordBody"><tr><td colspan="6"><div class="loading"></div></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/js/student.js"></script>
    <script src="/js/pages/student/apply-credit-substitute.js"></script>
</body>
</html>
