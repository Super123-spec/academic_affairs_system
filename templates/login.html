<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵阳信息科技学院教务管理系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
            background: url('/static/images/gate.jpg') center center / cover no-repeat fixed;
            position: relative;
            overflow: hidden;
        }

        /* 顶部校名标识 */
        .brand {
            position: absolute; top: 28px; left: 36px;
            display: flex; align-items: center; gap: 14px; z-index: 2;
        }
        .brand .logo-clip { width: 64px; height: 64px; overflow: hidden; flex-shrink: 0; }
        .brand .logo-clip img { height: 64px; display: block; }
        .brand .school-text .cn {
            font-size: 30px; font-weight: 700; color: #1b4fa0; letter-spacing: 4px;
            line-height: 1.2; text-shadow: 0 1px 2px rgba(255,255,255,0.6);
        }
        .brand .school-text .en { font-size: 12px; color: #1b4fa0; letter-spacing: 1px; margin-top: 4px; }

        /* 登录卡片 */
        .login-container {
            position: absolute; right: 8%; top: 50%; transform: translateY(-50%);
            width: 400px; background: rgba(20, 40, 80, 0.72); backdrop-filter: blur(6px);
            border-radius: 6px; padding: 36px 40px 30px;
            box-shadow: 0 12px 40px rgba(0, 20, 60, 0.35); z-index: 2;
        }
        .login-container h2 {
            text-align: center; color: #fff; font-size: 21px; font-weight: 600;
            letter-spacing: 3px; margin-bottom: 26px;
        }

        /* 身份切换选项卡 */
        .user-type-group { display: flex; margin-bottom: 22px; border-bottom: 1px solid rgba(255,255,255,0.25); }
        .user-type-group label {
            flex: 1; text-align: center; padding: 8px 0 12px; cursor: pointer;
            font-size: 15px; color: rgba(255,255,255,0.65); letter-spacing: 2px;
            position: relative; transition: color 0.2s;
        }
        .user-type-group input[type="radio"] { display: none; }
        .user-type-group label:has(input:checked) { color: #fff; }
        .user-type-group label:has(input:checked)::after {
            content: ''; position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
            width: 56px; height: 2px; background: #2f8bff;
        }

        .form-group { margin-bottom: 16px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.35);
            border-radius: 4px; font-size: 14px; background: rgba(255,255,255,0.16);
            color: #fff; transition: 0.2s; outline: none;
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.6); }
        .form-group input:focus { border-color: #2f8bff; background: rgba(255,255,255,0.24); }

        /* 验证码行 */
        .captcha-group { display: flex; gap: 10px; align-items: stretch; }
        .captcha-group input { flex: 1; }
        .captcha-group img {
            height: 44px; width: 124px; border-radius: 4px; background: #fff;
            cursor: pointer; flex-shrink: 0; display: block;
        }

        .error-msg {
            color: #ffd9d9; background: rgba(181,35,47,0.35); border: 1px solid rgba(255,120,120,0.5);
            padding: 9px 14px; border-radius: 4px; margin-bottom: 14px; font-size: 13px; display: none;
        }
        .error-msg.show { display: block; }

        .btn-login {
            width: 100%; padding: 12px; margin-top: 8px; background: #1677ff; border: none;
            border-radius: 4px; color: #fff; font-size: 16px; font-weight: 600;
            letter-spacing: 6px; text-indent: 6px; cursor: pointer; transition: background 0.2s;
        }
        .btn-login:hover { background: #3d8dff; }

        .footer-note {
            text-align: center; margin-top: 20px; color: rgba(255,255,255,0.55);
            font-size: 12px; letter-spacing: 1px; line-height: 1.8;
        }

        .page-footer {
            position: absolute; right: 24px; bottom: 16px; color: rgba(255,255,255,0.85);
            font-size: 12px; text-align: right; line-height: 1.8; letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4); z-index: 2;
        }

        @media (max-width: 768px) {
            body { overflow: auto; }
            .brand { top: 18px; left: 18px; }
            .brand .school-text .cn { font-size: 20px; letter-spacing: 2px; }
            .brand .school-text .en { font-size: 10px; }
            .login-container { position: static; transform: none; margin: 120px auto 40px; width: calc(100% - 40px); max-width: 400px; }
            .page-footer { position: static; text-align: center; padding-bottom: 16px; }
        }
    </style>
</head>
<body>
    <div class="brand">
        <div class="logo-clip"><img src="/static/images/logo.png" alt="贵阳信息科技学院校徽"></div>
        <div class="school-text">
            <div class="cn">贵阳信息科技学院</div>
            <div class="en">GUIYANG INSTITUTE OF INFORMATION SCIENCE AND TECHNOLOGY</div>
        </div>
    </div>

    <div class="login-container">
        <h2>教务管理系统</h2>

        <div class="user-type-group">
            <label><input type="radio" name="userType" value="student" checked> 学生</label>
            <label><input type="radio" name="userType" value="teacher"> 教师</label>
            <label><input type="radio" name="userType" value="admin"> 管理员</label>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="请输入学号 / 工号" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group captcha-group">
                <input type="text" id="captchaCode" placeholder="验证码" maxlength="4" autocomplete="off" required>
                <img id="captchaImg" alt="验证码，点击刷新" title="看不清？点击刷新">
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>
    </div>

    <div class="page-footer">©2026 贵阳信息科技学院 版权所有<br>教务管理系统</div>

    <script src="/js/pages/login.js"></script>
</body>
</html>
