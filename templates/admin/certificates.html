<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证书管理 - 教务管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="content" id="pageContent">
        <h2 class="page-title">证书管理</h2>
        <div class="toolbar">
            <div class="search-bar" style="margin-bottom:0;flex:1;">
                <input type="text" id="keyword" placeholder="学号 / 姓名 / 证书名称">
                <button class="btn btn-primary" data-action="loadList">查询</button>
            </div>
            <button class="btn btn-primary" data-action="openEdit">发放证书</button>
        </div>
        <div class="card"><div class="card-body">
            <table class="table">
                <thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>证书名称</th><th>证书编号</th><th>发证日期</th><th>发证单位</th><th>操作</th></tr></thead>
                <tbody id="listBody"><tr><td colspan="8"><div class="loading"></div></td></tr></tbody>
            </table>
        </div></div>
    </div>

    <script src="/js/admin.js"></script>
    <script src="/js/pages/admin/certificates.js"></script>
</body>
</html>
