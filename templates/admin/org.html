<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>院系专业班级 - 教务管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="content" id="pageContent">
        <h2 class="page-title">院系专业班级管理</h2>

        <div style="display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:18px;align-items:start;">
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
                    学院 <button class="btn btn-sm btn-primary" data-action="addCollege">新增</button>
                </div>
                <div class="card-body" style="padding:0;">
                    <table class="table"><tbody id="collegeBody"></tbody></table>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
                    专业 <button class="btn btn-sm btn-primary" data-action="addMajor">新增</button>
                </div>
                <div class="card-body" style="padding:0;">
                    <table class="table"><tbody id="majorBody"></tbody></table>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
                    班级 <span>
                        <button class="btn btn-sm btn-default" data-action="openImportDialog" data-arg='["class","班级","loadAll"]'>批量导入</button>
                        <button class="btn btn-sm btn-primary" data-action="addClass">新增</button>
                    </span>
                </div>
                <div class="card-body" style="padding:0;">
                    <table class="table">
                        <thead><tr><th>班级</th><th>专业</th><th>年级</th><th>人数</th><th></th></tr></thead>
                        <tbody id="classBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
    <script src="/js/pages/admin/org.js"></script>
</body>
</html>
