<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开课管理 - 教务管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="content" id="pageContent">
        <h2 class="page-title">开课管理</h2>
        <div class="toolbar">
            <div class="search-bar" style="margin-bottom:0;flex:1;">
                <select id="semesterSel"><option value="">全部学期</option></select>
                <button class="btn btn-primary" data-action="loadList">查询</button>
            </div>
            <button class="btn btn-primary" data-action="openEdit">新增开课</button>
        </div>
        <div class="card"><div class="card-body">
            <table class="table">
                <thead><tr><th>课程号</th><th>课程名称</th><th>学分</th><th>任课教师</th><th>班级</th><th>学期</th><th>容量/已选</th><th>成绩比例</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="listBody"><tr><td colspan="10"><div class="loading"></div></td></tr></tbody>
            </table>
        </div></div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header"><span id="modalTitle">新增开课</span><span class="modal-close" data-action="closeModal" data-arg='["editModal"]'>✕</span></div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="form-group"><label>课程 *</label><select id="f_courseId"></select></div>
                <div class="form-group"><label>任课教师</label><select id="f_teacherId"><option value="">待定</option></select></div>
                <div class="form-group"><label>指定班级（可多选，不选则不限班级）</label>
                    <div style="display:flex;gap:8px;margin-bottom:6px;align-items:center;">
                        <select id="f_filterMajor" data-change="renderClassBoxes" style="flex:1;"></select>
                        <button type="button" class="btn btn-sm btn-default" data-action="checkAllVisible">全选</button>
                        <button type="button" class="btn btn-sm btn-default" data-action="uncheckAll">清空</button>
                    </div>
                    <div id="f_classBoxes" style="display:flex;flex-wrap:wrap;gap:4px;max-height:130px;overflow-y:auto;border:1px solid #d1d5db;border-radius:4px;padding:8px;"></div>
                    <div id="f_classSelected" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>学期 *（点击可直接选择）</label><input type="text" id="f_semester" list="semesterList" placeholder="如 2025-2026-1">
                        <datalist id="semesterList"></datalist>
                    </div>
                    <div class="form-group"><label>容量</label><input type="number" id="f_maxCount" value="60" min="1"></div>
                </div>
                <div class="form-group"><label>成绩比例（总评 = 平时 × 平时占比 + 考试 × 考试占比）</label>
                    <div class="form-row">
                        <div class="form-group"><label>平时占比 %</label><input type="number" id="f_usualRatio" value="40" min="0" max="100" step="1" data-input="syncRatio"></div>
                        <div class="form-group"><label>考试占比 %</label><input type="number" id="f_examRatio" value="60" min="0" max="100" step="1" data-input="syncRatio"></div>
                    </div>
                </div>
                <div class="form-group"><label>状态</label>
                    <select id="f_status"><option>开放</option><option>关闭</option></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" data-action="closeModal" data-arg='["editModal"]'>取消</button>
                <button class="btn btn-primary" data-action="saveOffering">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
    <script src="/js/pages/admin/offerings.js"></script>
</body>
</html>
